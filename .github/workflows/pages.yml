# Publish the web viewer and the daily tables on GitHub Pages.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
#
# Runs on every push that changes the viewer or the tables, such as KC's daily
# push from scorer/local_run.py.

name: Publish viewer

on:
  push:
    branches: [main]
    paths: ["viewer/**", "tables/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site from viewer/ and tables/
        run: |
          mkdir _site
          cp viewer/index.html viewer/viewer.css viewer/viewer.js _site/
          # Stamp the script and stylesheet links with the commit: Pages lets
          # browsers keep files for 10 minutes, and a reload revalidates the
          # page but not its cached files, so a new name fetches them at once.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html
          # Pages serves 404.html for paths it does not know, so dated URLs
          # such as <base>/2026-10-06 still load the viewer, which reads the
          # date from the URL.
          cp _site/index.html _site/404.html
          if [ -d tables ]; then cp -r tables _site/tables; fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
