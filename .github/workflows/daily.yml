# Score the day's arXiv listing, commit the table and publish the viewer.
#
# Two routes, chosen by the repository variable MAPHUB_VIA (or the run's input):
#   api          the Claude API; secret ANTHROPIC_API_KEY (a key with a spend limit)
#   claude-code  Claude Code on a subscription seat; secret
#                CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`), and the
#                variable MAPHUB_OWN_PARTICIPANTS listing the columns it may score
# Both routes need the secret PORTFOLIOS_TOKEN: a fine-grained token for
# kailicao/maphub-portfolios only, with read access to its contents.
#
# Scheduled runs started on Oct 6, 2026, after a successful manual run.
# Run logs are public; the scorer logs counts and pseudonyms, never portfolio text.

name: Daily table

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Listing date YYYY-MM-DD (empty: the current listing)"
        required: false
        default: ""
      via:
        description: "Route (default: the MAPHUB_VIA variable, else api)"
        required: false
        default: "default"
        type: choice
        options: ["default", "api", "claude-code"]
      test:
        description: "Score 5 astro-ph and 5 cs.AI papers only; commit nothing"
        type: boolean
        default: false
  schedule:
    # A fallback: KC scores each listing in the morning with
    # scorer/local_run.py, since scheduled runs can start hours late (6 h 40
    # min on Oct 7, 2026). Monday to Friday at 17:17 UTC (1:17 PM ET in summer,
    # 12:17 PM in winter), this run scores a listing he missed, through the
    # API; when the listing is already in the tables it stops at no cost.
    # Off the top of the hour, when GitHub may drop scheduled runs under load
    # (the first one, at 06:00 UTC on Oct 7, 2026, never started).
    - cron: "17 17 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-table
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      VIA: ${{ (inputs.via != '' && inputs.via != 'default') && inputs.via || vars.MAPHUB_VIA || 'api' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the portfolios
        uses: actions/checkout@v7
        with:
          repository: kailicao/maphub-portfolios
          token: ${{ secrets.PORTFOLIOS_TOKEN }}
          path: maphub-portfolios

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the scorer's requirements
        run: pip install -r scorer/requirements.txt

      - name: Install Claude Code
        if: env.VIA == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code

      - name: Score
        env:
          ANTHROPIC_API_KEY: ${{ env.VIA == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.VIA == 'claude-code' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          MAPHUB_OWN_PARTICIPANTS: ${{ vars.MAPHUB_OWN_PARTICIPANTS }}
          DATE: ${{ inputs.date }}
          TEST: ${{ inputs.test && '--test' || '' }}
        # --via is always explicit: a rerun for yesterday counts as a past date,
        # which would otherwise default to Claude Code.
        run: python scorer/daily_table.py $DATE $TEST --via "$VIA"

      - name: Commit the table
        id: commit
        if: ${{ !inputs.test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tables
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The scorer writes the message: date, route, portfolios commit,
          # configuration and columns, so git log records each table's provenance.
          if [ -f .work/commit-message.txt ]; then
            git commit -q -F .work/commit-message.txt
          else
            day=$(git diff --cached --name-only | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\.parquet' | head -1)
            git commit -q -m "Table for ${day%.parquet} (via $VIA)"
          fi
          git push -q
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: score
    if: needs.score.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
